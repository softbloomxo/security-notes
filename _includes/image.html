{% assign image_path = include.file %}
{% if page.image_dir %}{% assign image_path = page.image_dir | append: '/' | append: include.file %}{% endif %}
<a class="image-link content-image" href="{{ image_path | relative_url }}" target="_blank" rel="noopener"><img src="{{ image_path | relative_url }}"{% if include.alt %} alt="{{ include.alt | escape }}"{% else %} alt=""{% endif %} loading="lazy"></a>
